<!-- Only show header/sidebar/footer if not on login page -->
<ng-container *ngIf="!isLoginPage()">
  <a *ngIf="authService.isAuthenticated()" (click)="authService.logout()" style="float: right; padding: 10px;">
    🔓 Logout
  </a>

  <!-- HEADER -->
  <header style="background-color: #3f51b5; color: white; padding: 10px;">
    <h1 style="margin: 0;">🏡 Society Management Portal</h1>
  </header>

  <!-- LAYOUT -->
  <div style="display: flex; min-height: calc(100vh - 60px);">
    <app-sidebar></app-sidebar>

    <main style="flex-grow: 1; padding: 20px;">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- FOOTER -->
  <footer style="background-color: #eee; padding: 10px; text-align: center;">
    Developed by <strong>Shivaprasad Reddy Dharmala</strong> |
    📧 <a href="mailto:shivaprasadreddy.dharmala@gmail.com">shivaprasadreddy.dharmalagmail.com</a>
  </footer>
</ng-container>

<!-- Show only login content -->
<router-outlet *ngIf="isLoginPage()"></router-outlet>
